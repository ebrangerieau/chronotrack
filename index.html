
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoTrack</title>
    <meta name="theme-color" content="#13ec5b" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#13ec5b",
              "primary-dark": "#0fa441",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
              "text-light": "#0d1b12",
              "text-dark": "#e0e6e2",
              "text-subtle-light": "#6b7f73",
              "text-subtle-dark": "#8a9c90",
              "card-light": "#ffffff",
              "card-dark": "#1a3123",
              "border-light": "#e3e8e4",
              "border-dark": "#2a4d37",
              positive: "#16a34a",
              negative: "#dc2626",
              warning: "#f59e0b",
              info: "#3b82f6",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
              monospace: ["Roboto Mono", "monospace"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: 100dvh;
        -webkit-tap-highlight-color: transparent;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      
      @media print {
        @page {
          size: A4;
          margin: 1.5cm;
        }

        body, html {
          background-color: #fff !important;
          color: #000 !important;
        }
        
        /* Cacher toute l'application par défaut lors de l'impression */
        body * {
          visibility: hidden;
        }

        /* Rendre le conteneur du rapport et tous ses enfants visibles */
        #pdf-report-container, #pdf-report-container * {
          visibility: visible;
        }
        
        /* Positionner le rapport en haut de la page pour qu'il soit le seul élément imprimable */
        #pdf-report-container {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          font-family: Inter, sans-serif;
        }
        
        #pdf-report-container table {
          width: 100%;
          border-collapse: collapse;
          font-size: 9pt;
        }

        #pdf-report-container th,
        #pdf-report-container td {
          border: 1px solid #ddd;
          padding: 8px;
          text-align: left;
        }

        #pdf-report-container th {
          background-color: #f2f2f2;
          font-weight: 600;
        }

        #pdf-report-container h1 {
          font-size: 18pt;
          margin-bottom: 0.5rem;
        }
        
        #pdf-report-container h2 {
           font-size: 14pt;
           margin-bottom: 1.5rem;
           color: #555;
           font-weight: 500;
        }

        #pdf-report-container .summary-table {
          margin-top: 2rem;
          width: 50%;
          margin-left: auto;
          font-size: 10pt;
        }
        
        #pdf-report-container .summary-table td:first-child {
          font-weight: 600;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
    "firebase/": "https://aistudiocdn.com/firebase@^12.5.0/"
  }
}
</script>
</head>
  <body class="bg-background-light dark:bg-background-dark">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
